name: Baixar imagens das notícias

on:
  push:
    paths: ["noticias/imagens.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar cada imagem listada em noticias/imagens.json
        run: |
          mkdir -p noticias/img
          python3 - <<'PY'
          import json, urllib.request
          lista = json.load(open("noticias/imagens.json"))
          for nome, url in lista.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (ByOrbit news bot)"})
              try:
                  data = urllib.request.urlopen(req, timeout=60).read()
                  open(f"noticias/img/{nome}.jpg", "wb").write(data)
                  print("ok", nome, len(data))
              except Exception as e:
                  print("falhou", nome, e)
          PY
      - name: Salvar no repositório
        run: |
          git config user.name "ByOrbit"
          git config user.email "guslimadev@gmail.com"
          git add noticias/img
          git diff --cached --quiet || (git commit -m "Imagens das notícias" && git pull --rebase -q && git push)
